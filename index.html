    <title>ARISE AND SHINE LEARNING POINT - Melvisharam</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Force instant cache purge and hard reload for old mobile apps/PWAs
      (function() {
        var LATEST_VERSION = 'v5_ultra_luxury_2026';
        try {
          var current = localStorage.getItem('aslp_client_build');
          if (current !== LATEST_VERSION) {
            localStorage.setItem('aslp_client_build', LATEST_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    return Promise.all(registrations.map(function(r) { return r.unregister(); }));
                  });
                }
              }).then(function() {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Capture PWA install prompt globally as early as possible so it is never missed
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>
